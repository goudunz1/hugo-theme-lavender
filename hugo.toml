# By default, theme configurations will not be merged with project's own, except for [params] (deep copy) and [menus]
# (shallow copy). But when theme project folder is used as a standalone repo, this doubles as a working example config.
# See README.md for configuration tutorials.

baseURL = "https://example.org/"
languageCode = "en-US"
title = "My New Hugo Site"

[params]
  blogName = "My Blog"
  author = "Author"
  avatar = ""
  intro = "Welcome to my blog."
  themeDefault = "auto"
  backToTop = true
  tableOfContents = true
  faviconSvg = true
  faviconPath = "/"
  math = false
  markdownInlineMath = true
  searchEnabled = true

  [params.pagination]
    posts = 12
    tags = 24

  [[params.social]]
    name = "GitHub"
    icon = "github"
    url = "https://github.com/"
  [[params.social]]
    name = "Twitter"
    icon = "twitter-x"
    url = "https://twitter.com/"
  [[params.social]]
    name = "Email"
    icon = "envelope"
    url = "mailto:you@example.com"

  [[params.aboutItems]]
    title = "About me"
    content = "This is where you introduce yourself."
  [[params.aboutItems]]
    title = "Projects"
    content = "Describe your projects here."
  [[params.aboutItems]]
    title = "Contact"
    content = "How to reach you."

  [[params.friends]]
    name = "Hugo"
    url = "https://gohugo.io/"
    avatar = "https://gohugo.io/img/hugo.png"
    desc = "The world's fastest framework for building websites."
  [[params.friends]]
    name = "Tailwind CSS"
    url = "https://tailwindcss.com/"
    avatar = "https://tailwindcss.com/favicons/favicon-32x32.png?v=3"
    desc = "A utility-first CSS framework for rapid UI development."
  [[params.friends]]
    name = "Bootstrap Icons"
    url = "https://icons.getbootstrap.com/"
    avatar = "https://icons.getbootstrap.com/favicon.ico"
    desc = "Free, high quality, open source icon set."

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
    params = { icon = "house-door" }
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20
    params = { icon = "collection" }
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 30
    params = { icon = "tags" }
  [[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 40
    params = { icon = "grid" }
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 50
    params = { icon = "person" }
  [[menus.main]]
    name = "Links"
    pageRef = "/links"
    weight = 60
    params = { icon = "link-45deg" }
  [[menus.main]]
    name = "Search"
    pageRef = "/search"
    weight = 70
    params = { icon = "search" }

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[module]
  [module.hugoVersion]
    extended = false
    min = "0.146.0"

[outputs]
  home = ["HTML"]
