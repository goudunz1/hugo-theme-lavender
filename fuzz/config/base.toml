# Play with:
# hugo server --config fuzz/config/base.toml,fuzz/config/<variant>.toml -D --disableFastRender 

baseURL = "http://127.0.0.1:1313/"
languageCode = "en-US"
title = "Testing the Lavender Hugo theme"
contentDir = "fuzz/content"
publishDir = "fuzz/public"
staticDir = ["fuzz/static", "static"]

[params]
# --- Site parameters ---
blogName = "Test Blog"
avatar = "/avatar.svg"
intro = "Test site for the Lavender Hugo theme."
themeDefault = "auto"
faviconPath = "/"
faviconSvg = true
searchEnabled = true
backToTop = true
markdownInlineMath = true
# --- (Default values for) Page parameters ---
author = "Tester"
tableOfContents = true
math = false
readingTime = true

[params.pagination]
posts = 9
tags = 12

[[params.social]]
name = "GitHub"
icon = "github"
url = "https://github.com/"

[[params.social]]
name = "Twitter"
icon = "twitter-x"
url = "https://twitter.com/"

[[params.social]]
name = "Email"
icon = "envelope"
url = "mailto:you@example.com"

[[params.aboutItems]]
title = "About"
content = "This is a fuzz-test site."

[[params.aboutItems]]
title = "Projects"
content = "Various fuzz projects."

[[params.aboutItems]]
title = "Contact"
content = "Reach out for bugs."

[[params.friends]]
name = "Hugo"
url = "https://gohugo.io/"
avatar = "https://gohugo.io/img/hugo.png"
desc = "The world's fastest framework for building websites."

[[params.friends]]
name = "Tailwind CSS"
url = "https://tailwindcss.com/"
avatar = "https://tailwindcss.com/favicons/favicon-32x32.png?v=3"
desc = "A utility-first CSS framework."

[[params.friends]]
name = "Bootstrap Icons"
url = "https://icons.getbootstrap.com/"
avatar = "https://icons.getbootstrap.com/favicon.ico"
desc = "Free, high quality, open source icon set."

[[menus.main]]
name = "Home"
pageRef = "/"
weight = 10
params = { icon = "house-door" }

[[menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 20
params = { icon = "collection" }

[[menus.main]]
name = "Tags"
pageRef = "/tags"
weight = 30
params = { icon = "tags" }

[[menus.main]]
name = "Categories"
pageRef = "/categories"
weight = 40
params = { icon = "grid" }

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 50
params = { icon = "person" }

[[menus.main]]
name = "Links"
pageRef = "/links"
weight = 60
params = { icon = "link-45deg" }

[[menus.main]]
name = "Search"
pageRef = "/search"
weight = 70
params = { icon = "search" }

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[markup.highlight]
noClasses = false
lineNos = false
codeFences = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[outputs]
home = ["HTML"]

[module.hugoVersion]
extended = false
min = "0.146.0"
