{{- define "main" }}
  {{- $blogName := site.Params.blogName | default site.Title }}
  {{- $intro := site.Params.intro | default "" }}
  <section class="hero-page">
    {{ partial "avatar.html" . }}
    <h1 class="m-0 font-bold text-[2.5rem]">{{ $blogName }}</h1>
    {{- with $intro }}
      <p class="text-muted max-w-160 mx-auto">{{ . }}</p>
    {{- end }}
    {{ partial "social.html" . }}
    {{- with .Content }}
      <div class="post-content">{{ . }}</div>
    {{- end }}
  </section>
{{- end }}
