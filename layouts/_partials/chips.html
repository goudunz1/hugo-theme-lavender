{{- $links := .links }}
{{- $caption := .caption }}
<div class="panel px-4 py-[0.9rem]">
  <p class="caption">{{- $caption }}</p>
  <div class="flex flex-wrap gap-[0.4rem]">
    {{- range $links }}
      <a class="chip-link" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{- end }}
  </div>
</div>
