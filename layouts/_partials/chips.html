{{- $links := .links }}
{{- $caption := .caption }}
<div class="panel">
  <p class="caption">{{- $caption }}</p>
  <div class="gap-1.5 flex flex-wrap">
    {{- range $links }}
      <a class="chip max-w-full" href="{{ .RelPermalink }}"><span class="truncate">{{ .LinkTitle }}</span></a>
    {{- end }}
  </div>
</div>
