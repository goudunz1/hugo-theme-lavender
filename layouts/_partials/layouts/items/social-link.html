{{/* Params: */ -}}
{{/* "icon": icon font key */ -}}
{{/* "url": link URL */ -}}

{{ $icon := .icon | default "link" -}}
{{/* External links are opened in a new tab. */ -}}
{{ $iconCls :=
  "border-accent bg-bg text-muted text-17 size-11 flex items-center justify-center rounded-full border-2"
-}}
<a class="{{ $iconCls }}" href="{{ .url }}" title="{{ .name }}" target="_blank" rel="noopener">
  <i class="ti ti-{{ $icon }}"></i>
</a>
