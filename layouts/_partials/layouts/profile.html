{{/* Round avatar on hero page, linking to home. */ -}}
{{ $blogName := site.Params.blogName | default site.Title | default "Unnamed" -}}
<a
  class="bg-bg p-1 size-35 hover:shadow-profile rounded-full border-4 no-underline select-none hover:scale-105"
  href="{{ `` | relLangURL }}"
  title="{{ $blogName }}">
  {{ with site.Params.avatar -}}
    <img class="rounded-full object-cover" src="{{ . | relURL }}" alt="{{ $blogName }}" />
  {{ end -}}
</a>
