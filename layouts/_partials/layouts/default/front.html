<div class="wrap-break-word">
  <h1 class="text-[1.875rem]">{{ .title }}</h1>
  {{ with .desc -}}
    <p class="mt-1.25 text-14 text-muted">{{ . }}</p>
  {{ end -}}
  {{ with .meta -}}
    <div class="mt-1.25 text-14 gap-3 text-muted flex flex-wrap">
      {{/* `min-w-0` set the first label flex-shrink-able. */ -}}
      {{ $sorted := sort . "weight" -}}
      {{ $first := true -}}
      {{ range $item := $sorted -}}
        <p class="{{ if $first }}min-w-0{{ end }} gap-1.25 flex items-baseline">
          <i class="ti ti-{{ $item.icon }}"></i>
          <span {{ if $first }}class="truncate"{{ end }}>{{ $item.label }}</span>
        </p>
        {{ $first = false -}}
      {{ end -}}
    </div>
  {{ end -}}
</div>
