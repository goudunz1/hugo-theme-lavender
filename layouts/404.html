{{ define "main" -}}
  <section class="pt-10 my-auto text-center wrap-break-word">
    <p class="text-accent font-bold text-[7.5rem]/[1.1] select-none">404</p>
    <h1 class="font-bold mt-2 text-[1.5rem]">{{ i18n "pageNotFound" }}</h1>
    <p class="text-14 text-muted mt-3">{{ i18n "pageNotFoundDesc" }}</p>
    {{/* text-center takes effect only on inline blocks. */ -}}
    <a
      class="text-fg text-14 py-2 gap-1.25 mt-5 hover:text-accent inline-flex items-baseline no-underline"
      href="{{ `` | relLangURL }}">
      <i class="ti ti-home"></i><span>{{ i18n "backHome" }}</span>
    </a>
  </section>
{{ end -}}
