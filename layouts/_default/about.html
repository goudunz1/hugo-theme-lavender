{{- define "main" }}
  <section class="gap-5 px-4 pt-10 pb-4 flex flex-col items-center text-center">
    {{ partial "avatar.html" . }}
    <h1 class="m-0 font-bold text-[2.5rem]">{{ .Title }}</h1>
    {{- with site.Params.aboutItems }}
      <div class="mt-6 max-w-184 mx-auto flex w-full flex-col gap-[0.6rem] text-left">
        {{- range $i, $item := . }}
          <div class="accordion">
            <button type="button" class="accordion-head">
              <span>{{ $item.title }}</span>
              <i class="accordion-chevron bi bi-chevron-down"></i>
            </button>
            <div class="accordion-body">
              <div class="post-content text-muted! pb-4 px-[1.1rem]">{{ $item.content | markdownify }}</div>
            </div>
          </div>
        {{- end }}
      </div>
    {{- end }}
    {{- with .Content }}
      <div class="post-content">{{ . }}</div>
    {{- end }}
  </section>
{{- end }}
