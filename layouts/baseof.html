<!doctype html>
<html lang="{{ site.Language.LanguageCode | default `en` }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "sidebar.html" . }}
    <div class="sidebar:ml-19 min-w-86 flex min-h-dvh flex-col">
      <main class="max-w-275 px-6 py-4 mobile:px-6 mobile:py-8 mx-auto flex w-full flex-1 flex-col">
        {{ block "main" . }}{{ end }}
      </main>
      <footer class="max-w-275 p-6 pb-10 my-4 mx-auto flex w-full flex-col text-center">
        {{ partialCached "footer.html" . }}
      </footer>
    </div>
    {{- if site.Params.backToTop | default true }}
      <button
        type="button"
        id="back-to-top"
        class="icon-button text-fg right-6 bottom-6 translate-y-2.5 fixed z-30 opacity-0 transition"
        title="{{ i18n `backToTop` }}">
        <i class="ti ti-arrow-up"></i>
      </button>
    {{- end }}
    {{ partialCached "head/js.html" . }}
  </body>
</html>
