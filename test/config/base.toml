# Base configuration for the Lavender test site.
#
# From the repository root:
#
#   hugo --config test/config/base.toml --buildDrafts
#   hugo --config test/config/base.toml,test/config/<variant>.toml --buildDrafts
#   hugo server --config test/config/base.toml,test/config/<variant>.toml -D --disableFastRender
#
# Variant files merge on top of this one; later files override earlier ones.

baseURL = "http://127.0.0.1:1313/"
title = "Testing the Lavender Hugo theme"
contentDir = "test/content"
dataDir = "test/data"
publishDir = "test/public"
staticDir = ["test/static", "static"]

# Three taxonomies: the two Hugo defaults plus a custom `series`, to exercise
# `params.taxonomyLayout.<singular>` and the taxonomy bulletins on posts.
[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[params]
# --- Site parameters ---
blogName = "Test Blog"
avatar = "/avatar.svg"
intro = "Test site for the Lavender Hugo theme."
themeDefault = "auto"
faviconPath = "/"
faviconSvg = true
searchEnabled = true
backToTop = true
markdownInlineMath = true
useCdn = true
# --- (Default values for) Page parameters ---
author = "Tester"
tableOfContents = true
math = false
readingTime = true
wordCount = true

[params.pageSize]
grid = 9
cloud = 12

# Which template a taxonomy page uses: "grid" or "cloud".
[params.taxonomyLayout]
category = "grid"
tag = "cloud"
series = "grid"

[[params.social]]
name = "GitHub"
icon = "brand-github"
url = "https://github.com/"

[[params.social]]
name = "Twitter"
icon = "brand-x"
url = "https://twitter.com/"

[[params.social]]
name = "Email"
icon = "mail"
url = "mailto:you@example.com"

[[params.aboutItems]]
title = "About"
content = "This is a test site for the Lavender theme."

[[params.aboutItems]]
title = "Generated cases"
content = "Most posts under /fuzz/ are generated at build time from a block pool."

[[params.aboutItems]]
title = "Config variants"
content = "Merge a file from `test/config/` to test highlighting, pagination and boundary params."

[[params.friends]]
name = "Hugo"
url = "https://gohugo.io/"
avatar = "https://gohugo.io/img/hugo.png"
desc = "The world's fastest framework for building websites."

[[params.friends]]
name = "Tailwind CSS"
url = "https://tailwindcss.com/"
avatar = "https://tailwindcss.com/favicons/favicon-32x32.png?v=3"
desc = "A utility-first CSS framework."

[[params.friends]]
name = "Bootstrap Icons"
url = "https://icons.getbootstrap.com/"
avatar = "https://icons.getbootstrap.com/favicon.ico"
desc = "Free, high quality, open source icon set."

[[menus.main]]
name = "Home"
pageRef = "/"
weight = 10
params = { icon = "home" }

[[menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 20
params = { icon = "files" }

[[menus.main]]
name = "Fuzz"
pageRef = "/fuzz"
weight = 30
params = { icon = "bug" }

[[menus.main]]
name = "Tags"
pageRef = "/tags"
weight = 40
params = { icon = "tags" }

[[menus.main]]
name = "Categories"
pageRef = "/categories"
weight = 50
params = { icon = "layout-grid" }

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 60
params = { icon = "user" }

[[menus.main]]
name = "Links"
pageRef = "/links"
weight = 70
params = { icon = "link" }

[[menus.main]]
name = "Search"
pageRef = "/search"
weight = 80
params = { icon = "search" }

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[markup.highlight]
noClasses = false
lineNos = false
codeFences = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[outputs]
home = ["HTML", "JSON"]

[module.hugoVersion]
extended = false
min = "0.165.0"
